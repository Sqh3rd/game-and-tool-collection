packages:
  - "apps/*"
  - "packages/**/*"
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  nx: true
  unrs-resolver: true
autoInstallPeers: true
minimumReleaseAgeExclude:
  - "eslint-plugin-playwright@2.11.0"
  - "globals@17.8.0"
onlyBuiltDependencies:
  - "nx"
overrides:
  "@nuxthub/core": "link:../nuxthub-core"
